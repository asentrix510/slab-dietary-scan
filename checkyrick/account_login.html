<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Safety Account - Login</title>
    <!-- Google Fonts: Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/account_style.css">
    <script type="module" src="js/account_auth.js"></script>
</head>

<body>
    <!-- Animated Background Elements -->
    <div class="floating-elements">
        <div class="floating-icon">🥗</div>
        <div class="floating-icon">🍎</div>
        <div class="floating-icon">🥑</div>
        <div class="floating-icon">🥕</div>
        <div class="floating-icon">🌶️</div>
        <div class="floating-icon">🧄</div>
        <div class="floating-icon">🧅</div>
        <div class="floating-icon">🥬</div>
    </div>

    <div class="auth-container">
        <!-- Sign In Form -->
        <div id="login-card" class="card">
            <h2>Welcome Back</h2>
            <div id="login-error" class="error-message"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            <div class="switch-auth">
                Don't have an account? <a id="show-signup">Create one</a>
            </div>
        </div>

        <!-- Sign Up Form (Hidden by default) -->
        <div id="signup-card" class="card" style="display: none;">
            <h2>Create Account</h2>
            <div id="signup-error" class="error-message"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Create a password (min 6 chars)">
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="switch-auth">
                Already have an account? <a id="show-login">Sign In</a>
            </div>
        </div>
    </div>
</body>

</html>
