<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register — DietXplore</title>
    <meta name="description" content="Sign in or register for your DietXplore food safety account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/account_style.css">
    <script type="module" src="js/account_auth.js"></script>
</head>

<body>
    <!-- Background Grid Texture -->
    <div class="grid-background" aria-hidden="true"></div>

    <div class="auth-wrapper">
        <div class="auth-container">
            <!-- Brand Header -->
            <div class="auth-brand">
                <a href="index.html" class="logo" aria-label="DietXplore Home">
                    <span class="brand-name">Diet<span class="brand-accent">Xplore</span></span>
                </a>
            </div>

            <!-- Sign In Form -->
            <div id="login-card" class="card">
                <div class="card-body">
                    <h2>Welcome back</h2>
                    <p class="auth-subtitle">Log in to automatically apply your saved allergies and food preferences.</p>
                    <div id="login-error" class="error-message" role="alert"></div>

                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">Email address</label>
                            <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span>Sign In</span>
                        </button>
                    </form>

                    <div class="switch-auth">
                        <span>Don't have an account?</span> <a id="show-signup" role="button" tabindex="0">Create one for free</a>
                    </div>
                </div>
            </div>

            <!-- Sign Up Form (Hidden by default) -->
            <div id="signup-card" class="card" style="display: none;">
                <div class="card-body">
                    <h2>Create your account</h2>
                    <p class="auth-subtitle">Set up your dietary restrictions once, and we'll apply them to every scan.</p>
                    <div id="signup-error" class="error-message" role="alert"></div>

                    <form id="signup-form">
                        <div class="form-group">
                            <label for="signup-email">Email address</label>
                            <input type="email" id="signup-email" required placeholder="you@example.com" autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" required placeholder="At least 6 characters" minlength="6" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span>Create Account</span>
                        </button>
                    </form>

                    <div class="switch-auth">
                        <span>Already have an account?</span> <a id="show-login" role="button" tabindex="0">Sign in instead</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
